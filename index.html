<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paper-maker · 可打印的 A4 小工具</title>
    <meta
      name="description"
      content="paper-maker：打开网页、调好参数、打印 A4。涂色页、口算页、舒尔特方格等练习页生成器合集，纯前端、免注册、无广告。"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1a1a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --paper: #fffdf8;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
      }
      .sheet {
        width: min(720px, 100%);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: clamp(28px, 6vw, 64px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(34px, 6vw, 52px);
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 0 0 28px;
        font-size: 16px;
        line-height: 1.7;
        color: var(--muted);
      }
      ul.tools {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0;
        margin: 0 0 32px;
      }
      ul.tools li {
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 14px;
      }
      ul.tools li::before {
        content: "· ";
        color: var(--accent);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 14px;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      footer {
        margin-top: 28px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <span class="tag">需求分析阶段 · v0.2 · 中 / EN</span>
      <h1>paper-maker</h1>
      <p class="sub">
        打开网页，调好参数，打印一张 A4。涂色页、口算页、舒尔特方格……把「找资源、去水印、排 A4」的麻烦，变成一次点击。界面与打印内容支持中英文切换，默认跟随浏览器。
      </p>
      <ul class="tools">
        <li>涂色页</li>
        <li>口算页</li>
        <li>舒尔特方格</li>
        <li>更多工具规划中</li>
      </ul>
      <div class="links">
        <a href="https://github.com/alfredhuang211/paper-maker">GitHub 仓库</a>
        <a href="https://github.com/alfredhuang211/paper-maker/blob/main/docs/02-prd.md">产品需求文档</a>
        <a href="https://github.com/alfredhuang211/paper-maker/blob/main/docs/01-market-analysis.md">需求分析</a>
      </div>
      <footer>
        占位页：仅用于验证 GitHub Pages 部署链路，不是应用代码。主页面子应用列表与中英文切换将在 M1 起实现。
      </footer>
    </main>
  </body>
</html>
